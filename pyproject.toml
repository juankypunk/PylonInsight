[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyloninsight"
version = "0.1.0"
description = "Tools for analyzing Pylontech BatteryView exports"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]